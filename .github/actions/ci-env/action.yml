name: CI environment
description: >-
  Common first step for every CI job on this repo: checkout the workspace
  at a pinned SHA, install Determinate Nix, and wire the Cachix cache.
  Inputs match the upstream secrets available to the calling workflow —
  composite actions cannot resolve ${{ secrets.* }} directly, only
  ${{ inputs.* }}.
inputs:
  cachix-auth-token:
    description: >-
      Cachix auth token (stored as CACHIX_AUTH_TOKEN). Omitted = pull-only
      (the cache is still a substituter; only pushes require a token).
    required: false
    default: ""
  fetch-depth:
    description: >-
      Passed through to actions/checkout's fetch-depth. Default 1 (shallow)
      is right for every job except publish, which needs full history for
      tag creation and Pages publishing.
    required: false
    default: "1"
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
    - uses: ./setup-nix
      with:
        cachix-auth-token: ${{ inputs.cachix-auth-token }}
