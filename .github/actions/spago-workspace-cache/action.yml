name: Spago workspace cache
description: >-
  Warm-start the spago workspace (package downloads + purs compile cache)
  across runs for the jobs that build PureScript. Restores at the step and
  saves at job end. Run after actions/checkout — the key hashes workspace
  files.
runs:
  using: composite
  steps:
    # Fail loud if the caller skipped actions/checkout: hashFiles would then
    # hash nothing, keying the cache `spago--` and letting the `spago-`
    # prefix restore unrelated entries.
    - name: Require a checked-out workspace
      shell: bash
      run: |
        for f in flake.nix pure/spago.yaml; do
          if [ ! -f "$f" ]; then
            echo "::error::spago-workspace-cache must run after actions/checkout (missing $f)"
            exit 1
          fi
        done
    # The key covers only toolchain and package-set config: purs recompiles
    # changed sources itself and rejects externs written by another compiler
    # version, so a stale restore is safe and source churn must not mint new
    # cache entries. flake.nix carries the spago pin that flake.lock does not.
    # One home for the key: every PureScript-building job warms the same
    # entries and the key cannot drift between them.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          pure/.spago
          pure/output
        key: spago-${{ hashFiles('flake.nix') }}-${{ hashFiles('pure/spago.yaml') }}
        restore-keys: |
          spago-${{ hashFiles('flake.nix') }}-
