name: Set up Nix
description: >-
  Installs Determinate Nix and wires the Cachix binary cache — Nix builds are
  substituted from, and pushed back to, a Cachix cache.
inputs:
  cachix-auth-token:
    description: >-
      Cachix auth token (stored as the CACHIX_AUTH_TOKEN repo secret).
      Pull + push requires it: omitted = pull-only (cachix-action will still
      resolve the cache as a substituter).
    required: false
    default: ""
runs:
  using: composite
  steps:
    # Determinate Nix installer. @v3 is a moving major tag: upstream patch
    # releases (nix version bumps) land in CI without a repo edit; bump the
    # tag deliberately to control that rate of change. The install is
    # otherwise pinned by the action's own nix.conf.
    - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
    # The cache must be configured after Nix is installed. cachix-action
    # registers the cache as a substituter (adds it to nix.conf) and
    # registers a post-build-hook so newly built store paths are pushed to
    # Cachix. If the `omp-agency` cache uses Cachix-managed signing (the
    # default for new caches), Cachix signs paths itself and only the auth
    # token is needed. For self-signed caches, also forward
    # `secrets.CACHIX_SIGNING_KEY` through a second composite input — the
    # cachix-action step's signingKey input expects it; a mismatched
    # signingKey silently fails push (logged at info level, job still
    # exits green).
    #
    # Precondition: the calling job must run actions/checkout first — the
    # composite is a local-path action (`./.github/actions/setup-nix`), and
    # the runner resolves it against the checked-out workspace. No
    # checkout means no action.yml on disk and the step fails before Nix
    # is even installed.
    #
    # Composite actions cannot resolve ${{ secrets.* }} directly — only
    # ${{ inputs.* }} — so the workflow job forwards the secret as an
    # explicit input. jobs.<job_id>.steps.with does have the secrets context;
    # the composite's own with: does not.
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: omp-agency
        authToken: ${{ inputs.cachix-auth-token }}
