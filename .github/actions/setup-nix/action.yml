name: Set up Nix
description: >-
  Installs Determinate Nix and enables the Magic Nix Cache — Nix builds are
  cached in the GitHub Actions cache, with no additional service and no
  secrets.
runs:
  using: composite
  steps:
    # Determinate Nix installer. @v3 is a moving major tag: upstream patch
    # releases (nix version bumps) land in CI without a repo edit; bump the
    # tag deliberately to control that rate of change. The install is
    # otherwise pinned by the action's own nix.conf.
    - uses: DeterminateSystems/determinate-nix-action@v3
    # The cache must be configured after Nix is installed. Repo-local cache
    # only (GitHub Actions cache; not FlakeHub Cache): use-gha-cache is
    # explicit and FlakeHub is explicitly disabled — under Determinate Nix
    # its default is opportunistic and would try to register with FlakeHub.
    - uses: DeterminateSystems/magic-nix-cache-action@v15
      with:
        use-gha-cache: enabled
        use-flakehub: disabled