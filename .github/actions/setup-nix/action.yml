name: Set up Nix
description: >-
  Installs Determinate Nix and wires the Cachix binary cache — Nix builds are
  substituted from, and pushed back to, a Cachix cache.
inputs:
  cachix-auth-token:
    description: >-
      Cachix auth token (stored as the CACHIX_AUTH_TOKEN repo secret).
      Pull + push requires it: omitted = pull-only (cachix-action will still
      resolve the cache as a substituter).
    required: false
    default: ""
runs:
  using: composite
  steps:
    # Determinate Nix installer. @v3 is a moving major tag: upstream patch
    # releases (nix version bumps) land in CI without a repo edit; bump the
    # tag deliberately to control that rate of change. The install is
    # otherwise pinned by the action's own nix.conf.
    - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3
    # The cache must be configured after Nix is installed. cachix-action
    # registers the cache as a substituter (adds it to nix.conf), registers a
    # post-build-hook so newly built store paths are pushed to Cachix, and
    # Cachix signs paths with its own key (so no signing-key secret is needed
    # — only the auth token).
    #
    # Composite actions cannot resolve ${{ secrets.* }} directly — only
    # ${{ inputs.* }} — so the workflow job forwards the secret as an
    # explicit input. jobs.<job_id>.steps.with does have the secrets context;
    # the composite's own with: does not.
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: omp-agency
        authToken: ${{ inputs.cachix-auth-token }}