name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PR CI is read-only by default; jobs that need more declare their own
# permissions explicitly below.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Determinate Nix installer (v3 tracks the latest v3.x release): fast
      # multi-user install with a pinned, deterministic nix.conf.
      - uses: DeterminateSystems/determinate-nix-action@v3
      # Caches Nix builds in the GitHub Actions cache — no additional service
      # or secrets; must run after Nix is installed.
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      # The devShell provides `just` (runners ship neither nix-profiles nor
      # just); IN_NIX_SHELL inside makes the recipes' own nix routing a no-op.
      # `just test` builds the generated CLI/API bundles and the Nickel WASM
      # first — a clean source checkout ships no dist artifacts.
      - run: nix develop --accept-flake-config -c just test

  lint:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix develop --accept-flake-config -c just lint

  lint-skills:
    name: Skill prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix develop --accept-flake-config -c just lint-skills

  runtime-check:
    name: Runtime package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      # Prove the generated runtime package: stage the minimal closure from the
      # fresh build and verify manifest paths, staged imports, and Nickel
      # workflow evaluation without a checked-in dist tree.
      - run: nix develop --accept-flake-config -c just runtime-check /tmp/runtime-package

  # Publication runs only on pushes to main, with write access, serialized so
  # two merges cannot race tag creation or a Pages deploy.
  publish:
    name: Publish runtime
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, lint-skills, runtime-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    # Serialize publication: two merges to main must not race tag creation or
    # a Pages deploy. In-flight runs finish first.
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      DIST_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Build generated runtime artifacts
        run: nix develop --accept-flake-config -c just build nickel-build
      - name: Stage runtime package
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "tag=dist-${source_sha}" >> "$GITHUB_ENV"
          nix develop --accept-flake-config -c node scripts/package-runtime.mjs \
            --out /tmp/runtime-package --verify
      - name: Create orphan distribution commit
        # An orphan commit whose tree is exactly the staged runtime package —
        # no source, no build scripts, no Pages-only marketplace/ staging dir.
        # Built with a temporary index against the checkout's own object
        # database so the commit is immediately taggable and pushable.
        id: dist
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$(mktemp -u)"
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree --empty
          GIT_WORK_TREE=/tmp/runtime-package git add -A
          tree="$(git write-tree)"
          dist_commit="$(git commit-tree "$tree" -m "dist: runtime package for ${DIST_SHA}")"
          rm -f "$GIT_INDEX_FILE"
          echo "sha=${dist_commit}" >> "$GITHUB_OUTPUT"
        env:
          DIST_SHA: ${{ github.sha }}
      - name: Create or adopt distribution tag
        id: tag
        # Idempotent: if the remote tag already exists (rerun of the same
        # source commit), adopt its exact commit and never recreate or repoint
        # it. Only a missing tag is created — never a force update.
        run: |
          set -euo pipefail
          # --exit-code makes ls-remote exit 2 when the tag is absent, so a
          # transport/auth failure (any other exit code) fails the step
          # instead of being misread as "tag absent".
          if remote_sha="$(git ls-remote --exit-code origin "refs/tags/${DIST_TAG}" | cut -f1)"; then
            echo "dist_commit=${remote_sha}" >> "$GITHUB_OUTPUT"
            echo "distribution tag ${DIST_TAG} already exists at ${remote_sha} — adopting it"
            exit 0
          else
            ls_remote_status=$?
            if [ "${ls_remote_status}" -ne 2 ]; then
              echo "ls-remote failed with status ${ls_remote_status} — not treating as tag absence" >&2
              exit "${ls_remote_status}"
            fi
          fi
          git tag "${DIST_TAG}" "${DIST_COMMIT}"
          git push origin "refs/tags/${DIST_TAG}"
          pushed_sha="$(git ls-remote --exit-code origin "refs/tags/${DIST_TAG}" | cut -f1)"
          if [ "${pushed_sha}" != "${DIST_COMMIT}" ]; then
            echo "remote tag ${DIST_TAG} is ${pushed_sha:-missing}, expected ${DIST_COMMIT}" >&2
            exit 1
          fi
          echo "dist_commit=${DIST_COMMIT}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ env.tag }}
          DIST_COMMIT: ${{ steps.dist.outputs.sha }}
      - name: Verify distribution tag is reachable
        run: |
          set -euo pipefail
          # --exit-code: a transport failure must not be read as "tag absent";
          # only exit 2 (no matching refs) is tolerated here, and the exact-SHA
          # comparison below catches the absent case.
          remote_sha="$(git ls-remote --exit-code origin "refs/tags/${DIST_TAG}" | cut -f1)"
          if [ "${remote_sha}" != "${DIST_COMMIT}" ]; then
            echo "tag ${DIST_TAG} remote ${remote_sha:-missing} != intended ${DIST_COMMIT}" >&2
            exit 1
          fi
          echo "distribution tag ${DIST_TAG} → ${remote_sha} (verified)"
        env:
          DIST_TAG: ${{ env.tag }}
          DIST_COMMIT: ${{ steps.tag.outputs.dist_commit }}
      - name: Generate distribution catalog and Pages site
        # Runs after the distribution commit exists so the catalog's sha is
        # the real orphan dist commit, and after the tag is reachable on the
        # remote so Pages never advertises a missing ref.
        run: |
          version="${DIST_TAG}"
          nix develop --accept-flake-config -c node scripts/package-runtime.mjs \
            --out /tmp/catalog-package \
            --catalog "${DIST_REPO}" "${DIST_TAG}" "${DIST_COMMIT}" "${version}" \
            --verify
        env:
          DIST_TAG: ${{ env.tag }}
          DIST_COMMIT: ${{ steps.tag.outputs.dist_commit }}
      - name: Collect Pages site
        run: |
          mkdir -p /tmp/pages-site
          cp -a /tmp/catalog-package/marketplace/. /tmp/pages-site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site
      - uses: actions/deploy-pages@v4