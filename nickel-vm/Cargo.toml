[package]
name = "nickel-vm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# must equal the wasm-bindgen-cli in the flake's locked nixpkgs — the CLI
# refuses version-skewed artifacts (locked rev ships 0.2.127)
wasm-bindgen = "=0.2.127"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
nickel-lang-core = { version = "0.18.0", default-features = false }


[profile.release]
lto = true
opt-level = 'z'
